# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build"

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      
jobs:
  build:
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}
    name: Build 
    runs-on: windows-2022
    env:
      Configuration: Debug
      DeployExtension: False
      VsixManifestPath: src\source.extension.vsixmanifest
      VsixManifestSourcePath: src\source.extension.cs
      
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET build dependencies
      uses: timheuer/bootstrap-dotnet@v2
      with:
        nuget: 'false'
        sdk: 'false'
        msbuild: 'true'

    - name: Increment VSIX version
      id: vsix_version
      uses: timheuer/vsix-version-stamp@v2
      with:
        manifest-file: ${{ env.VsixManifestPath }}
        vsix-token-source-file: ${{ env.VsixManifestSourcePath }}

    - name: Build
      run: msbuild /v:m -restore /p:OutDir=\_built

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}.vsix
        path: /_built/**/*.vsix

    - name: Run Tests
      # See https://github.com/microsoft/vstest-action/issues/31
      # uses: microsoft/vstest-action@v1.0.0
      uses: josepho0918/vstest-action@main
      with:
        searchFolder: /_built/
        testAssembly: /**/*Tests.dll

    # The results are published by publish-test-results.yml. It runs after this workflow with write access, so that it
    # also works for pull requests from forks, which get a read-only token here.
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ runner.os }}
        path: testresults/**/*.trx
        if-no-files-found: warn

    # The publishing workflow does not run in the context of the pull request, so it needs the event to find it.
    - name: Upload event file
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: EventFile
        path: ${{ github.event_path }}
